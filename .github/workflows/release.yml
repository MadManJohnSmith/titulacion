name: Release multiplataforma

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: android }
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Java 17 (para Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias de Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-3-dev ninja-build cmake clang

      - name: Restaurar la firma permanente de Android
        if: matrix.target == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/loboapp-upload-v1.p12
          chmod 600 android/app/loboapp-upload-v1.p12
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=loboapp-upload-v1.p12\n'
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Compilar APKs
        if: matrix.target == 'android'
        run: flutter build apk --release --split-per-abi

      - name: Verificar identidad, versión y firma de Android
        if: matrix.target == 'android'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt"
          test -n "$EXPECTED_CERT_SHA256"
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK" \
              > "$RUNNER_TEMP/signature.txt"
            # El propio código de salida de `apksigner verify` ya es la
            # comprobación criptográfica. Para la identidad, exportar el
            # certificado en PEM y calcular la huella con OpenSSL: así no
            # dependemos del idioma ni del formato de texto de apksigner.
            "$TOOLS/apksigner" verify --print-certs-pem "$APK" \
              > "$RUNNER_TEMP/certificate.pem"
            ACTUAL=$(openssl x509 -in "$RUNNER_TEMP/certificate.pem" \
              -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test -n "$ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Firma inesperada en $APK" >&2
              echo "Esperada: $EXPECTED" >&2
              echo "Actual:   $ACTUAL" >&2
              exit 1
            fi
            BADGING=$("$TOOLS/aapt" dump badging "$APK")
            if ! grep -q \
              "package: name='mx.buap.loboapp' versionCode='2007' versionName='1.3.1'" \
              <<< "$BADGING"; then
              echo "Identidad o versión inesperada en $APK" >&2
              printf '%s\n' "$BADGING" | head -1 >&2
              exit 1
            fi
          done

      - name: Compilar Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Compilar Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Compilar macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Empaquetar (Android)
        if: matrix.target == 'android'
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "dist/LoboApp-${TAG}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "dist/LoboApp-${TAG}-android-armv7.apk"

      - name: Empaquetar (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          tar -czf "dist/LoboApp-${TAG}-linux-x64.tar.gz" \
              -C build/linux/x64/release bundle

      - name: Empaquetar (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/LoboApp-${tag}-windows-x64.zip"

      - name: Empaquetar (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          ditto -ck --keepParent --sequesterRsrc \
            build/macos/Build/Products/Release/LoboApp.app \
            "dist/LoboApp-${TAG}-macos.zip"

      - name: Publicar en la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
